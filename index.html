<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Nutrition Tracker</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1C2530">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<style>

  .auth-toggle-link {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .auth-toggle-link a {
    color: var(--accent);
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }

  .forgot-link {
    display: block;
    text-align: center;
    margin-top: 10px;
    font-size: 12px;
    color: var(--ink-soft);
    text-decoration: none;
    cursor: pointer;
  }

  .password-field-wrap {
    position: relative;
  }

  .password-field-wrap input {
    margin-bottom: 0;
    padding-right: 42px;
  }

  .password-toggle-btn {
    position: absolute;
    top: 50%;
    right: 6px;
    transform: translateY(-50%);
    width: auto;
    margin: 0;
    padding: 6px;
    background: transparent;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .password-toggle-btn svg { display: block; }

</style>
</head>
<body>

<header>
  <div class="titles">
    <div class="eyebrow">Nutrition Tracker</div>
    <h1 id="headerTitle">Welcome</h1>
  </div>
</header>

<main>

  <!-- ============ LOGIN / SIGNUP ============ -->
  <div class="card" id="authCard" style="display:none;">

    <h2 id="authHeading">Sign In</h2>

    <label for="emailInput">Email</label>
    <input type="text" id="emailInput" placeholder="you@example.com" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">

    <label for="passwordInput">Password</label>
    <div class="password-field-wrap">
      <input type="password" id="passwordInput" placeholder="At least 8 characters" autocomplete="current-password">
      <button type="button" class="password-toggle-btn" aria-label="Show password" onclick="togglePasswordVisibility('passwordInput', this)"></button>
    </div>

    <button id="authSubmitBtn" onclick="submitAuth()">Sign In</button>
    <div class="result-box" id="authResultBox"></div>

    <div class="auth-toggle-link" id="authToggleText">
      Don't have an account? <a onclick="setAuthMode('signup')">Create one</a>
    </div>

    <a class="forgot-link" id="forgotLink" onclick="forgotPassword()">Forgot your password?</a>

  </div>

  <!-- ============ SET NEW PASSWORD (shown only via a password reset email link) ============ -->
  <div class="card" id="resetCard" style="display:none;">

    <h2>Set a New Password</h2>
    <div class="helper" style="margin-top:-4px;">You're here because you clicked a password reset link. Choose a new password below to finish.</div>

    <label for="newPasswordInput">New Password</label>
    <div class="password-field-wrap">
      <input type="password" id="newPasswordInput" placeholder="At least 8 characters" autocomplete="new-password">
      <button type="button" class="password-toggle-btn" aria-label="Show password" onclick="togglePasswordVisibility('newPasswordInput', this)"></button>
    </div>

    <label for="confirmPasswordInput">Confirm New Password</label>
    <div class="password-field-wrap">
      <input type="password" id="confirmPasswordInput" placeholder="Re-enter your new password" autocomplete="new-password">
      <button type="button" class="password-toggle-btn" aria-label="Show password" onclick="togglePasswordVisibility('confirmPasswordInput', this)"></button>
    </div>

    <button onclick="submitNewPassword()">Set New Password</button>
    <div class="result-box" id="resetResultBox"></div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./calc.js"></script>
<script src="./app.js"></script>
<script>

let authMode = "login"; // "login" or "signup"
let isPasswordRecovery = false;

// Supabase fires this when the recovery-link session is established —
// this MUST be listened for before the normal getSession() check runs,
// otherwise a recovery visit looks identical to a normal logged-in visit
// and the person gets bounced straight to Daily Log without ever being
// asked to set a new password.
sb.auth.onAuthStateChange(function(event, session) {
  if (event === "PASSWORD_RECOVERY") {
    isPasswordRecovery = true;
    showResetForm();
  }
});

window.addEventListener("load", async function() {

  registerServiceWorker();
  initPasswordToggles();

  // Give onAuthStateChange a brief moment to fire for PASSWORD_RECOVERY
  // before deciding what to show, since it can arrive just after load.
  await new Promise(function(resolve) { setTimeout(resolve, 150); });

  if (isPasswordRecovery) return; // showResetForm() already ran

  const { data } = await sb.auth.getSession();

  if (data.session) {
    window.location.href = "./diary.html";
  } else {
    showAuthForm();
  }

});

function showAuthForm() {
  document.getElementById("headerTitle").textContent = "Welcome";
  document.getElementById("authCard").style.display = "block";
  document.getElementById("resetCard").style.display = "none";
}

function showResetForm() {
  document.getElementById("headerTitle").textContent = "Reset Password";
  document.getElementById("authCard").style.display = "none";
  document.getElementById("resetCard").style.display = "block";
}

const EYE_ICON = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='20' height='20' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z'></path><circle cx='12' cy='12' r='3'></circle></svg>";
const EYE_OFF_ICON = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='20' height='20' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24'></path><line x1='1' y1='1' x2='23' y2='23'></line></svg>";

function initPasswordToggles() {
  document.querySelectorAll(".password-toggle-btn").forEach(function(btn) {
    btn.innerHTML = EYE_ICON;
  });
}

function togglePasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  const nowShowing = input.type === "password";
  input.type = nowShowing ? "text" : "password";
  btn.innerHTML = nowShowing ? EYE_OFF_ICON : EYE_ICON;
  btn.setAttribute("aria-label", nowShowing ? "Hide password" : "Show password");
}

function setAuthMode(mode) {

  authMode = mode;
  const heading = document.getElementById("authHeading");
  const submitBtn = document.getElementById("authSubmitBtn");
  const toggleText = document.getElementById("authToggleText");
  const forgotLink = document.getElementById("forgotLink");

  if (mode === "signup") {
    heading.textContent = "Create Account";
    submitBtn.textContent = "Create Account";
    toggleText.innerHTML = "Already have an account? <a onclick=\"setAuthMode('login')\">Sign in</a>";
    forgotLink.style.display = "none";
  } else {
    heading.textContent = "Sign In";
    submitBtn.textContent = "Sign In";
    toggleText.innerHTML = "Don't have an account? <a onclick=\"setAuthMode('signup')\">Create one</a>";
    forgotLink.style.display = "block";
  }

  document.getElementById("authResultBox").className = "result-box";
  document.getElementById("authResultBox").textContent = "";

}

function isStrongEnough(password) {
  // Baseline: 8+ characters. This is a client-side floor for a good
  // error message — Supabase's own project-level minimum (set in
  // Authentication settings) is the real enforcement backstop.
  return password && password.length >= 8;
}

function submitAuth() {

  const email = document.getElementById("emailInput").value.trim();
  const password = document.getElementById("passwordInput").value;

  if (!email) { showAuthResult(false, "Enter your email."); return; }

  if (authMode === "signup" && !isStrongEnough(password)) {
    showAuthResult(false, "Password must be at least 8 characters.");
    return;
  }
  if (!password) { showAuthResult(false, "Enter your password."); return; }

  showAuthResult(true, authMode === "signup" ? "Creating account..." : "Signing in...");

  const action = (authMode === "signup") ? signUp(email, password) : logIn(email, password);

  action.then(function(data) {

    // Signup can succeed WITHOUT creating a session — Supabase requires
    // the person to click a confirmation link in their email first if
    // "Confirm email" is enabled for this project. Redirecting anyway
    // here would bounce them straight back to this screen with no
    // explanation, looking exactly like signup silently failed.
    if (authMode === "signup" && !data.session) {
      showAuthResult(true, "Account created! Check " + email + " for a confirmation email, then come back and sign in.");
      setAuthMode("login");
      document.getElementById("emailInput").value = email;
      return;
    }

    window.location.href = "./diary.html";

  }).catch(function(err) {
    // Deliberately generic on login failure — never confirm or deny
    // whether an email address has an account, which would let someone
    // enumerate valid accounts by testing addresses one at a time.
    if (authMode === "login") {
      showAuthResult(false, "Incorrect email or password.");
    } else {
      showAuthResult(false, err.message);
    }
  });

}

function forgotPassword() {

  const email = document.getElementById("emailInput").value.trim();
  if (!email) { showAuthResult(false, "Enter your email above first, then tap this link again."); return; }

  showAuthResult(true, "Sending...");

  sendPasswordReset(email).then(function() {
    // Same message whether or not the email actually has an account —
    // again, avoids leaking which addresses are registered.
    showAuthResult(true, "If an account exists for " + email + ", a reset link has been sent.");
  }).catch(function() {
    showAuthResult(true, "If an account exists for " + email + ", a reset link has been sent.");
  });

}

function submitNewPassword() {

  const newPassword = document.getElementById("newPasswordInput").value;
  const confirmPassword = document.getElementById("confirmPasswordInput").value;

  if (!isStrongEnough(newPassword)) { showResetResult(false, "Password must be at least 8 characters."); return; }
  if (newPassword !== confirmPassword) { showResetResult(false, "Passwords don't match."); return; }

  showResetResult(true, "Updating password...");

  sb.auth.updateUser({ password: newPassword }).then(function(result) {
    if (result.error) { showResetResult(false, result.error.message); return; }
    showResetResult(true, "Password updated. Redirecting...");
    setTimeout(function() { window.location.href = "./diary.html"; }, 1200);
  }).catch(function(err) {
    showResetResult(false, err.message);
  });

}

function showAuthResult(ok, message) {
  const box = document.getElementById("authResultBox");
  box.className = "result-box " + (ok ? "ok" : "error");
  box.textContent = message;
}

function showResetResult(ok, message) {
  const box = document.getElementById("resetResultBox");
  box.className = "result-box " + (ok ? "ok" : "error");
  box.textContent = message;
}

</script>

</body>
</html>
