<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Edit a Recipe</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1C2530">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<style>

  .ingredient-row {
    display: flex; align-items: center; gap: 8px; padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .ingredient-row:last-child { border-bottom: none; }
  .ingredient-name { flex: 1; font-size: 14px; font-weight: 600; }
  .ingredient-row input, .ingredient-row select { margin-bottom: 0; width: 70px; padding: 8px; font-size: 13px; }
  .ingredient-row select { width: 78px; }
  .remove-btn { width: auto; padding: 6px 10px; font-size: 16px; background: transparent; border: none; color: var(--error); line-height: 1; }

  .result-item.checkable { display: flex; align-items: center; gap: 10px; }
  .result-item.checkable input[type="checkbox"] { width: auto; margin: 0; }

  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 14px; margin-top: 4px; }
  .summary-grid .label { color: var(--ink-soft); }
  .summary-grid .value { font-weight: 700; font-family: 'Manrope', sans-serif; }

</style>
</head>
<body>

<header>
  <div class="titles">
    <div class="eyebrow">Recipes</div>
    <h1>Edit a Recipe</h1>
  </div>
  <a class="back" href="./index.html">&larr; Home</a>
</header>

<main>

  <div class="card" id="searchCard">
    <h2>Find a recipe</h2>
    <label for="searchInput">Search</label>
    <input type="text" id="searchInput" placeholder="Start typing..." oninput="onSearchInput()">
    <div class="result-list" id="results"></div>
  </div>

  <div class="card" id="editCard" style="display:none;">
    <h2 id="editHeading">Edit details</h2>

    <input type="hidden" id="originalName">

    <label for="servingsInput">Servings this recipe makes</label>
    <input type="text" id="servingsInput" placeholder="1" value="1">

    <div style="display:flex; align-items:center; gap:8px; margin-top:6px; margin-bottom:14px;">
      <input type="checkbox" id="sharedInput" style="width:auto; margin:0;">
      <label for="sharedInput" style="margin:0; font-weight:600; font-size:13px; color:var(--ink);">Share this recipe (other users can view &amp; import a copy)</label>
    </div>

    <h2 style="margin-top:16px;">Ingredients</h2>
    <label for="ingredientSearch">Search your Foods</label>
    <input type="text" id="ingredientSearch" placeholder="Start typing a saved food..." oninput="onIngredientSearch()" onkeypress="if(event.key==='Enter'){event.preventDefault();onIngredientEnterPressed();}">
    <div class="result-list" id="ingredientResults" style="display:none;"></div>
    <button class="secondary" id="addSelectedBtn" style="display:none; margin-top:10px;" onclick="addSelectedIngredients()">Add Selected</button>

    <div id="ingredientUsdaSection" style="display:none;">
      <div class="helper">USDA database (tap one to import &amp; add)</div>
      <div class="result-list" id="ingredientUsdaResults"></div>
    </div>

    <button class="secondary" id="searchIngredientUsdaBtn" style="display:none;" onclick="searchIngredientUsda()">
      Search USDA for &ldquo;<span id="ingredientUsdaQueryLabel"></span>&rdquo;
    </button>

    <div class="card" id="ingredientListCard" style="margin-top:14px; margin-bottom:0; padding:0; border:none; background:transparent;">
      <div id="ingredientList"></div>
    </div>

    <button onclick="saveChanges()" style="margin-top:14px;">Save Changes</button>
    <button class="secondary" style="margin-top:10px;" onclick="cancelEdit()">Cancel / Search Again</button>
    <button class="secondary" style="margin-top:10px; color:var(--error); border-color:var(--error);" onclick="deleteThisRecipe()">Delete This Recipe</button>

    <div class="result-box" id="resultBox"></div>

    <div id="summaryBlock" style="display:none; margin-top:14px;">
      <h2 style="margin-bottom:8px;">Recipe Summary</h2>
      <div class="summary-grid">
        <div class="label">Total Weight</div><div class="value" id="sumWeight"></div>
        <div class="label">Calories</div><div class="value" id="sumCalories"></div>
        <div class="label">Protein</div><div class="value" id="sumProtein"></div>
        <div class="label">Fat</div><div class="value" id="sumFat"></div>
        <div class="label">Carbs</div><div class="value" id="sumCarbs"></div>
        <div class="label">Fiber</div><div class="value" id="sumFiber"></div>
      </div>
    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./calc.js"></script>
<script src="./app.js"></script>
<script>

let localFoodNames = [];
let localRecipeNames = [];
let ingredients = []; // { name, amount, unit }
let selectedNames = new Set();
let currentRecipeName = "";

window.addEventListener("load", async function() {

  const session = await requireAuth();
  if (!session) return;

  registerServiceWorker();

  apiGet("getFoodNames").then(function(json) { if (json.success) localFoodNames = json.data; });
  apiGet("getRecipeNames").then(function(json) { if (json.success) localRecipeNames = json.data; });

  const params = new URLSearchParams(window.location.search);
  const presetName = params.get("name");
  if (presetName) loadRecipe(presetName);

});

function onSearchInput() {

  const query = document.getElementById("searchInput").value.trim().toLowerCase();
  const container = document.getElementById("results");

  if (query.length === 0) { container.innerHTML = ""; return; }

  const matches = localRecipeNames.filter(function(name) { return name.toLowerCase().indexOf(query) !== -1; }).slice(0, 8);

  if (matches.length === 0) {
    container.innerHTML = "<div class='empty-state'>No matches.</div>";
    return;
  }

  container.innerHTML = matches.map(function(name) {
    return "<div class='result-item' onclick='loadRecipe(" + jsStringLiteral(name) + ")'>" +
      "<div class='item-name'>" + escapeHtml(name) + "</div></div>";
  }).join("");

}

function loadRecipe(name) {

  apiGet("getRecipeForEditing", { name: name }).then(function(json) {

    if (!json.success) { alert("Could not load recipe: " + json.error); return; }

    currentRecipeName = name;
    document.getElementById("originalName").value = name;
    document.getElementById("editHeading").textContent = "Editing: " + name;
    document.getElementById("servingsInput").value = json.data.servings;
    document.getElementById("sharedInput").checked = !!json.data.isShared;

    ingredients = json.data.ingredients.map(function(ing) {
      return { name: ing.name, amount: String(ing.amount), unit: ing.unit };
    });

    renderIngredients();

    document.getElementById("searchCard").style.display = "none";
    document.getElementById("editCard").style.display = "block";
    document.getElementById("resultBox").className = "result-box";
    document.getElementById("resultBox").textContent = "";
    document.getElementById("summaryBlock").style.display = "none";

  }).catch(function(err) {
    alert("Could not reach the backend: " + err.message);
  });

}

function cancelEdit() {
  document.getElementById("searchCard").style.display = "block";
  document.getElementById("editCard").style.display = "none";
  document.getElementById("searchInput").value = "";
  document.getElementById("results").innerHTML = "";
  ingredients = [];
}

function onIngredientSearch() {

  const query = document.getElementById("ingredientSearch").value.trim().toLowerCase();
  const resultsBox = document.getElementById("ingredientResults");

  selectedNames.clear();
  updateSelectedCount();
  document.getElementById("ingredientUsdaSection").style.display = "none";
  document.getElementById("ingredientUsdaResults").innerHTML = "";

  if (query.length === 0) {
    resultsBox.style.display = "none";
    document.getElementById("searchIngredientUsdaBtn").style.display = "none";
    return;
  }

  const matches = localFoodNames.filter(function(name) { return name.toLowerCase().indexOf(query) !== -1; }).slice(0, 8);
  resultsBox.style.display = "block";

  if (matches.length === 0) {
    resultsBox.innerHTML = "<div class='empty-state'>No matches in your Foods list.</div>";
  } else {
    resultsBox.innerHTML = matches.map(function(name) {
      const safeId = "chk_" + btoa(unescape(encodeURIComponent(name))).replace(/[^a-zA-Z0-9]/g, "");
      return "<div class='result-item checkable'>" +
        "<input type='checkbox' id='" + safeId + "' onchange='toggleSelected(" + jsStringLiteral(name) + ", this.checked)'>" +
        "<label for='" + safeId + "' class='item-name' style='flex:1; margin:0; font-weight:600; color:var(--ink);'>" + escapeHtml(name) + "</label></div>";
    }).join("");
  }

  document.getElementById("ingredientUsdaQueryLabel").textContent = query;
  document.getElementById("searchIngredientUsdaBtn").style.display = (query.length >= 2) ? "block" : "none";

}

function onIngredientEnterPressed() {
  const query = document.getElementById("ingredientSearch").value.trim();
  if (query.length >= 2 && selectedNames.size === 0) searchIngredientUsda();
}

function searchIngredientUsda() {

  const query = document.getElementById("ingredientSearch").value.trim();
  const usdaSection = document.getElementById("ingredientUsdaSection");
  const usdaResults = document.getElementById("ingredientUsdaResults");

  usdaSection.style.display = "block";
  usdaResults.innerHTML = "<div class='empty-state'>Searching USDA...</div>";

  apiGet("searchFoods", { query: query }).then(function(json) {
    if (!json.success) { usdaResults.innerHTML = "<div class='empty-state'>" + escapeHtml(json.error) + "</div>"; return; }
    if (json.data.length === 0) { usdaResults.innerHTML = "<div class='empty-state'>No USDA results found.</div>"; return; }
    usdaResults.innerHTML = json.data.map(function(food) {
      return "<div class='result-item' onclick='importIngredientFromUsda(" + food.fdcId + ")'>" +
        "<div class='item-name'>" + escapeHtml(food.description) + "</div>" +
        "<div class='item-meta'>" + escapeHtml(food.dataType) + (food.brand ? " &middot; " + escapeHtml(food.brand) : "") + "</div></div>";
    }).join("");
  }).catch(function(err) {
    usdaResults.innerHTML = "<div class='empty-state'>Could not reach USDA: " + escapeHtml(err.message) + "</div>";
  });

}

function importIngredientFromUsda(fdcId) {

  const usdaResults = document.getElementById("ingredientUsdaResults");
  usdaResults.innerHTML = "<div class='empty-state'>Importing...</div>";

  apiPost("importFood", { fdcId: fdcId }).then(function(json) {
    if (!json.success) { usdaResults.innerHTML = "<div class='empty-state'>" + escapeHtml(json.error) + "</div>"; return; }
    localFoodNames.push(json.data.name);
    ingredients.push({ name: json.data.name, amount: "", unit: json.data.serving_unit || "g" });
    document.getElementById("ingredientUsdaSection").style.display = "none";
    document.getElementById("ingredientSearch").value = "";
    onIngredientSearch();
    renderIngredients();
  }).catch(function(err) {
    usdaResults.innerHTML = "<div class='empty-state'>Import failed: " + escapeHtml(err.message) + "</div>";
  });

}

function toggleSelected(name, checked) {
  if (checked) selectedNames.add(name); else selectedNames.delete(name);
  updateSelectedCount();
}

function updateSelectedCount() {
  const count = selectedNames.size;
  const btn = document.getElementById("addSelectedBtn");
  if (count === 0) {
    btn.style.display = "none";
    const query = document.getElementById("ingredientSearch").value.trim();
    document.getElementById("searchIngredientUsdaBtn").style.display = (query.length >= 2) ? "block" : "none";
  } else {
    btn.style.display = "block";
    btn.textContent = (count === 1) ? "Add to Recipe" : "Add All (" + count + ") to Recipe";
    document.getElementById("searchIngredientUsdaBtn").style.display = "none";
    document.getElementById("ingredientUsdaSection").style.display = "none";
  }
}

function addSelectedIngredients() {

  const names = Array.from(selectedNames);

  Promise.all(names.map(function(name) {
    return apiGet("getFoodDetails", { name: name }).then(function(json) {
      const d = json.success ? json.data : null;
      return {
        name: name, unit: (d && d.servingUnit) ? d.servingUnit : "g",
        unitsHint: d ? buildIngredientUnitsHint(d.servingSize, d.servingUnit, d.altServingSize, d.altServingUnit) : null
      };
    }).catch(function() { return { name: name, unit: "g", unitsHint: null }; });
  })).then(function(results) {
    results.forEach(function(r) { ingredients.push({ name: r.name, amount: "", unit: r.unit, unitsHint: r.unitsHint }); });
    selectedNames.clear();
    document.getElementById("ingredientSearch").value = "";
    document.getElementById("ingredientResults").style.display = "none";
    updateSelectedCount();
    renderIngredients();
  });

}

function buildIngredientUnitsHint(servingSize, servingUnit, altServingSize, altServingUnit) {
  if (!servingSize || !servingUnit) return null;
  let text = "Native: " + formatAmountForDisplay(servingSize) + " " + servingUnit;
  if (altServingSize && altServingUnit) {
    text += " &middot; Also: " + formatAmountForDisplay(altServingSize) + " " + altServingUnit;
  }
  return text;
}

function removeIngredient(index) {
  ingredients.splice(index, 1);
  renderIngredients();
}

function updateIngredientAmount(index, value) { ingredients[index].amount = value; }
function updateIngredientUnit(index, value) { ingredients[index].unit = value; }

function renderIngredients() {

  const list = document.getElementById("ingredientList");

  if (ingredients.length === 0) {
    list.innerHTML = "<div class='empty-state'>No ingredients yet — search above to add some.</div>";
    return;
  }

  list.innerHTML = ingredients.map(function(ing, i) {
    return "<div class='ingredient-row'>" +
      "<span class='ingredient-name'>" + escapeHtml(ing.name) + (ing.unitsHint ? "<div class='helper' style='margin:2px 0 0; flex-basis:100%;'>" + ing.unitsHint + "</div>" : "") + "</span>" +
      "<input type='text' placeholder='amt' value='" + escapeHtml(ing.amount) + "' onchange='updateIngredientAmount(" + i + ", this.value)'>" +
      "<select onchange='updateIngredientUnit(" + i + ", this.value)'>" +
        ["g","kg","oz","lb","ml","l","tsp","tbsp","cup","fl_oz","piece","serving"].map(function(u) {
          const label = (u === "serving") ? "serving(s)" : (u === "piece") ? "piece(s)" : u;
          return "<option value='" + u + "'" + (ing.unit === u ? " selected" : "") + ">" + label + "</option>";
        }).join("") +
      "</select>" +
      "<button class='remove-btn' onclick='removeIngredient(" + i + ")'>&times;</button>" +
    "</div>";
  }).join("");

}

function parseAmount(str) {
  str = String(str).trim();
  const mixedMatch = str.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  if (mixedMatch) {
    const whole = parseInt(mixedMatch[1], 10), num = parseInt(mixedMatch[2], 10), denom = parseInt(mixedMatch[3], 10);
    if (denom === 0) return NaN;
    return whole + (num / denom);
  }
  const fractionMatch = str.match(/^(\d+)\/(\d+)$/);
  if (fractionMatch) {
    const num = parseInt(fractionMatch[1], 10), denom = parseInt(fractionMatch[2], 10);
    if (denom === 0) return NaN;
    return num / denom;
  }
  return parseFloat(str);
}

function saveChanges() {

  if (ingredients.length === 0) { showResult(false, "A recipe needs at least one ingredient."); return; }

  const payloadIngredients = [];
  for (let i = 0; i < ingredients.length; i++) {
    const amount = parseAmount(ingredients[i].amount);
    if (!amount || isNaN(amount) || amount <= 0) {
      showResult(false, "Enter a valid amount for \"" + ingredients[i].name + "\".");
      return;
    }
    payloadIngredients.push({ ingredient: ingredients[i].name, amount: amount, unit: ingredients[i].unit });
  }

  showResult(true, "Saving...");

  apiPost("saveRecipe", {
    recipeName: currentRecipeName,
    ingredients: payloadIngredients,
    servings: document.getElementById("servingsInput").value.trim() || "1",
    isShared: document.getElementById("sharedInput").checked
  }).then(function(json) {

    if (!json.success) { showResult(false, json.error); return; }

    showResult(true, "Saved changes to \"" + currentRecipeName + "\".");
    showSummary(json.data);

    if (confirm("Recalculate past logged entries that used this recipe with its updated ingredients?\n\nThis will change historical totals on days you already logged it. Choose Cancel to leave past logs as they were.")) {
      apiPost("recalculatePastLogsForRecipe", { name: currentRecipeName }).then(function(recalcJson) {
        if (recalcJson.success) {
          showResult(true, "Saved changes to \"" + currentRecipeName + "\". Updated " + recalcJson.data.count + " past log entr" + (recalcJson.data.count === 1 ? "y" : "ies") + ".");
        }
      });
    }

  }).catch(function(err) {
    showResult(false, "Could not reach the backend: " + err.message);
  });

}

function deleteThisRecipe() {

  if (!confirm("Delete \"" + currentRecipeName + "\" entirely? This can't be undone. Past logged entries that used it will keep their historical totals, but will no longer link to a recipe.")) return;

  apiPost("deleteRecipe", { name: currentRecipeName }).then(function(json) {
    if (!json.success) { showResult(false, json.error); return; }
    alert("Deleted \"" + currentRecipeName + "\".");
    localRecipeNames = localRecipeNames.filter(function(n) { return n !== currentRecipeName; });
    cancelEdit();
  }).catch(function(err) {
    showResult(false, "Could not reach the backend: " + err.message);
  });

}

function showResult(ok, message) {
  const box = document.getElementById("resultBox");
  box.className = "result-box " + (ok ? "ok" : "error");
  box.textContent = message;
}

function showSummary(summary) {
  document.getElementById("summaryBlock").style.display = "block";
  document.getElementById("sumWeight").textContent = formatAmountForDisplay(summary.totalWeight) + (summary.weightIsPartial ? "" : "g");
  document.getElementById("sumCalories").textContent = formatAmountForDisplay(summary.calories);
  document.getElementById("sumProtein").textContent = formatAmountForDisplay(summary.protein) + "g";
  document.getElementById("sumFat").textContent = formatAmountForDisplay(summary.fat) + "g";
  document.getElementById("sumCarbs").textContent = formatAmountForDisplay(summary.carbs) + "g";
  document.getElementById("sumFiber").textContent = formatAmountForDisplay(summary.fiber) + "g";
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = String(str);
  return div.innerHTML;
}

</script>

</body>
</html>
